services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cpaas
      POSTGRES_USER: cpaas
      POSTGRES_PASSWORD: cpaas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpaas -d cpaas"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://cpaas:cpaas@postgres:5432/cpaas
      JWT_SECRET: ${JWT_SECRET:-change-me-set-before-deploy}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
